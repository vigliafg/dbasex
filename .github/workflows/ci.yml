name: CI

on:
  push:
  pull_request:

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Librerie grafiche (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Installa
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test headless
        run: python -m pytest
      - name: Smoke headless
        run: python -m dbx --smoke
      - name: Cattura screenshot
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python tools/capture_ui.py
      - name: Artifact screenshot Silver
        if: runner.os == 'Linux' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: dbx-screenshots-silver
          path: docs/reference/dbx-ui/renders/*.png
          if-no-files-found: error
      - name: Harness E2E
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python tools/e2e_harness.py --skip-pytest --skip-smoke --output build/e2e-ci
      - name: Artifact report E2E
        if: runner.os == 'Linux' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: dbx-e2e-report
          path: build/e2e-ci
          if-no-files-found: error
